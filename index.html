
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NearBite - 精準美食探索</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <script>
    /**
     * Shim process.env for browser environments.
     * This prevents the app from crashing on static hosts like GitHub Pages
     * when it tries to check for API_KEY.
     */
    window.process = window.process || {};
    window.process.env = window.process.env || {};
    
    // 如果環境中沒有 API_KEY，我們將其初始化為空字串，
    // 這樣 App.tsx 就能正確偵測並顯示「金鑰未設定」的提示畫面。
    if (window.process.env.API_KEY === undefined) {
      window.process.env.API_KEY = "";
    }
  </script>
<script type="importmap">
{
  "imports": {
    "@google/genai": "https://esm.sh/@google/genai@^1.34.0",
    "react/": "https://esm.sh/react@^19.2.3/",
    "react": "https://esm.sh/react@^19.2.3",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/"
  }
}
</script>
<!-- 關鍵：明確加入進入點腳本 -->
<script type="module" src="index.tsx"></script>
<style>
  .leaflet-container {
    width: 100%;
    height: 100%;
    z-index: 1;
  }
  ::-webkit-scrollbar {
    width: 6px;
  }
  ::-webkit-scrollbar-track {
    background: #f1f5f9;
  }
  ::-webkit-scrollbar-thumb {
    background: #cbd5e1;
    border-radius: 10px;
  }
  ::-webkit-scrollbar-thumb:hover {
    background: #94a3b8;
  }
  /* 初始載入動畫 */
  .initial-loader {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100vh;
    background: #f8fafc;
    color: #64748b;
    font-family: sans-serif;
  }
</style>
</head>
<body class="bg-slate-50 text-slate-900 overflow-hidden">
  <div id="root">
    <!-- 當 JS 還沒載入完畢時顯示的內容 -->
    <div class="initial-loader">
      <div class="w-12 h-12 border-4 border-slate-200 border-t-orange-500 rounded-full animate-spin mb-4"></div>
      <p>正在初始化美食雷達...</p>
    </div>
  </div>
</body>
</html>
